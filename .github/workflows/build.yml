name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and package (unsigned)
        run: |
          npm run build
          CSC_LINK="" CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist -- --publish never
        shell: bash

      - name: Generate checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXE=$(ls release/*.exe | grep -m1 "$VERSION" || ls release/*.exe | head -1)
          if [ -z "$EXE" ]; then echo "ERROR: no exe found in release/"; exit 1; fi
          HASH=$(certutil -hashfile "$EXE" SHA256 | sed -n '2p' | tr -d '\r' | tr -d ' ')
          echo "$HASH  $(basename "$EXE")" > "$EXE.sha256"
          echo "wrote $(basename "$EXE.sha256") ($HASH)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror code to Gitee
        if: ${{ env.GITEE_TOKEN != '' }}
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{ github.repository }}
          dst: gitee/${{ secrets.GITEE_REPO }}
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: ${{ github.event.repository.name }}
          force_update: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
